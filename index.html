<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stodol MVP</title>

<style>
body { font-family: sans-serif; margin:0; background:#0f172a; color:white; }
.container { padding:20px; }
.hidden { display:none; }
input, button { padding:10px; margin:5px 0; }
.btn { background:#6366f1; color:white; border:none; cursor:pointer; }
.card { background:#1e293b; padding:15px; margin-bottom:10px; border-radius:10px; }
nav {
  position: sticky;
  top: 0;

  display: flex;
  justify-content: center;
  gap: 20px;

  background: #020617;
  padding: 8px 0;

  z-index: 1000;
}

nav div {
  cursor: pointer;
  font-size: 14px;
  opacity: 0.8;
}

nav div:hover {
  opacity: 1;
}
  
</style>
</head>

<body>

<!-- LANDING -->
<div id="landing" class="container">
<h1>Stodol</h1>
<p>Задачи + дашборд</p>
<button class="btn" onclick="showAuth()">Начать</button>
</div>

<!-- AUTH -->
<div id="auth" class="container hidden">
<h2>Вход</h2>
<input id="email" placeholder="email">
<input id="password" type="password" placeholder="password">
<br>
<button class="btn" onclick="login()">Войти</button>
<button class="btn" onclick="register()">Регистрация</button>
</div>

<!-- APP -->
<div id="app" class="hidden">

<nav>
<div onclick="openTab('dashboard')">Dashboard</div>
<div onclick="openTab('tasks')">Tasks</div>
<div onclick="showToday()">Today</div>
<div onclick="showWeek()">Week</div>
<div onclick="logout()">Logout</div>
</nav>

<div id="dashboard" class="container tab">
<h2 id="welcome"></h2>
<div class="card">
Задач всего: <span id="tasksCount">0</span>
</div>
<div class="card">Сегодня: <span id="todayCount">0</span></div>
<div class="card">Просрочено: <span id="overdueCount">0</span></div>
</div>

<div id="tasks" class="container tab hidden">
<h2>Tasks</h2>
<button onclick="setFilter('all')">Все</button>
<button onclick="setFilter('todo')">Активные</button>
<button onclick="setFilter('done')">Завершённые</button>
<button onclick="moveOverdueToTomorrow()">
  Перенести просроченные на завтра
</button>
  
<input id="taskInput" placeholder="Новая задача">
<input type="date" id="dueDateInput">
<button onclick="addTask()">Добавить</button>

<div id="tasksList"></div>
</div>

</div>

<!-- FIREBASE SDK -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  where,
  onSnapshot,
  updateDoc,
  doc,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


/* =========================
   ВСТАВЬ СЮДА СВОЙ CONFIG
========================= */
const firebaseConfig = {
  apiKey: "AIzaSyB8baDRTqe9MJatDx1RFIyClanisy9ejsU",
  authDomain: "stodol-ed717.firebaseapp.com",
  projectId: "stodol-ed717",
  storageBucket: "stodol-ed717.firebasestorage.app",
  messagingSenderId: "97983353190",
  appId: "1:97983353190:web:49011f895c5af9757e78a7",
  measurementId: "G-50STF7BC8G"
};

/* ========================= */


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let currentFilter = "todo";
window.tasksCache = [];

/* AUTH UI */

window.showAuth = () => {
  document.getElementById('landing').classList.add('hidden');
  document.getElementById('auth').classList.remove('hidden');
};


/* REGISTER */
window.register = async () => {
  try {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    await createUserWithEmailAndPassword(auth, email, password);

  } catch (e) {
    alert(e.message);
    console.error(e);
  }
};


/* LOGIN (реальный, не fake) */
window.login = async () => {
  try {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    await signInWithEmailAndPassword(auth, email, password);

  } catch (e) {
    alert(e.message);
    console.error(e);
  }
};


/* AUTH STATE */
onAuthStateChanged(auth, (user) => {
  if (user) {
    currentUser = user;

    document.getElementById('auth').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');

    document.getElementById('welcome').innerText =
      "С возвращением, " + user.email;

    startTasksListener();
    setTimeout(() => {
  showToday();
}, 300);
  }
});


/* LOGOUT */
window.logout = () => {
  signOut(auth);
  location.reload();
};


/* TASKS */

/* СОЗДАНИЕ */
window.addTask = async () => {
  const input = document.getElementById('taskInput');
  const dateInput = document.getElementById('dueDateInput');

  const text = input.value;
  const dueDate = dateInput.value;

  if (!text.trim()) return;

  await addDoc(collection(db, "tasks"), {
    text: text,
    status: "todo",
    priority: "medium",
    dueDate: dueDate || null,
    createdAt: Date.now(),
    userId: currentUser.uid
  });

  input.value = "";
  dateInput.value = "";
};


  window.moveOverdueToTomorrow = async () => {
  const today = new Date().toISOString().split('T')[0];

  const d = new Date();
  d.setDate(d.getDate() + 1);
  const tomorrow = d.toISOString().split('T')[0];

  const overdue = window.tasksCache.filter(
    t => t.dueDate && t.dueDate < today
  );

  for (let t of overdue) {
    await updateDoc(doc(db, "tasks", t.id), {
      dueDate: tomorrow
    });
  }
};

/* REALTIME (onSnapshot) */
function startTasksListener() {

  const q = query(
    collection(db, "tasks"),
    where("userId", "==", currentUser.uid)
  );

  onSnapshot(q, (snapshot) => {

    const tasks = snapshot.docs.map(doc => ({
      id: doc.id,
      ...doc.data()
}));

window.tasksCache = tasks;

    renderTasks(tasks);

  });
}

window.deleteTask = async (id) => {
  const ok = confirm("Удалить задачу?");

  if (!ok) return;

  await deleteDoc(doc(db, "tasks", id));
  closeModal();
};

  window.onclick = (e) => {
  const modal = document.getElementById('taskModal');

  if (e.target === modal) {
    closeModal();
  }
};

/* RENDER */
function renderTasks(tasks) {

  // 1. Сортировка по дате
  tasks.sort((a, b) => {
    if (!a.dueDate) return 1;
    if (!b.dueDate) return -1;
    return new Date(a.dueDate) - new Date(b.dueDate);
  });

  // 2. Дата сегодня
  const today = new Date().toISOString().split('T')[0];

  // 3. Метрики
  const total = tasks.length;
  const done = tasks.filter(t => t.status === 'done').length;
  const overdue = tasks.filter(t => t.dueDate && t.dueDate < today).length;
  const todayTasks = tasks.filter(t => t.dueDate === today).length;

  
  // 4. Обновляем dashboard
  document.getElementById('tasksCount').innerText = total;

  if (document.getElementById('todayCount')) {
    document.getElementById('todayCount').innerText = todayTasks;
  }

  if (document.getElementById('overdueCount')) {
    document.getElementById('overdueCount').innerText = overdue;
  }

  // 5. Очищаем список
  const list = document.getElementById('tasksList');
  list.innerHTML = "";

  // 6. Фильтр
  const filtered = tasks.filter(t => {
    if (currentFilter === "all") return true;
    return t.status === currentFilter;
  });

  // 7. Рендер задач
  filtered.forEach(t => {

    const isOverdue = t.dueDate && t.dueDate < today;
    const isToday = t.dueDate === today;
    const priorityColor =
  t.priority === 'high' ? 'orange' :
  t.priority === 'low' ? '#64748b' :
  'white';
    const div = document.createElement('div');
    div.className = "card";

div.innerHTML = `
<div onclick="openTaskModal('${t.id}')" style="
display:flex;
justify-content:space-between;
align-items:center;
cursor:pointer;
">

  <div>${t.text}</div>

  <div style="opacity:0.7">
    ${t.status === 'done' ? '✔' : ''}
  </div>

  <div style="opacity:0.7">
    ${t.dueDate || '—'}
  </div>

</div>
`;

    list.appendChild(div);
  });

}

  window.updateStatus = async (id, status) => {
  await updateDoc(doc(db, "tasks", id), {
    status: status
  });
};

  window.toggleStatus = async (id, currentStatus) => {
  const newStatus = currentStatus === 'done' ? 'todo' : 'done';

  await updateDoc(doc(db, "tasks", id), {
    status: newStatus
  });
};

window.setToday = async (id) => {
  const today = new Date().toISOString().split('T')[0];

  await updateDoc(doc(db, "tasks", id), {
    dueDate: today
  });
};

window.showToday = () => {
  const today = new Date().toISOString().split('T')[0];

  const todayTasks = window.tasksCache.filter(t => t.dueDate === today);

  renderTasks(todayTasks);

  openTab('tasks');
};

window.showWeek = () => {
  const today = new Date();

  const weekTasks = window.tasksCache.filter(t => {
    if (!t.dueDate) return false;

    const d = new Date(t.dueDate);
    const diff = (d - today) / (1000 * 60 * 60 * 24);

    return diff >= 0 && diff <= 7;
  });

  renderTasks(weekTasks);
  openTab('tasks');
};

window.setTomorrow = async (id) => {
  const d = new Date();
  d.setDate(d.getDate() + 1);
  const tomorrow = d.toISOString().split('T')[0];

  await updateDoc(doc(db, "tasks", id), {
    dueDate: tomorrow
  });
};

/* NAV */
window.openTab = (id) => {
  document.querySelectorAll('.tab').forEach(t => t.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
};

window.setFilter = (filter) => {
  currentFilter = filter;
  renderTasks(window.tasksCache);
};

window.setPriority = async (id, priority) => {
  await updateDoc(doc(db, "tasks", id), {
    priority: priority
  });
};
  
window.editTask = async (id, oldText) => {
  const newText = prompt("Измени задачу:", oldText);

  if (!newText || !newText.trim()) return;

  await updateDoc(doc(db, "tasks", id), {
    text: newText
  });
};

let currentTaskId = null;

window.openTaskModal = (id) => {
  const task = window.tasksCache.find(t => t.id === id);

  if (!task) return;

  currentTaskId = id;

  document.getElementById('modalTitle').innerText = task.text;
  document.getElementById('commentInput').value = task.comment || "";

  document.getElementById('taskModal').classList.remove('hidden');
};

window.closeModal = () => {
  document.getElementById('taskModal').classList.add('hidden');
};

window.saveComment = async () => {
  const text = document.getElementById('commentInput').value;

  await updateDoc(doc(db, "tasks", currentTaskId), {
    comment: text
  });

  closeModal();
};

document.addEventListener("DOMContentLoaded", () => {
  const input = document.getElementById("taskInput");

  if (input) {
    input.addEventListener("keypress", e => {
      if (e.key === "Enter") addTask();
    });
  }
});

</script>

    <!-- ✅ Service Worker регистрация — САМАЯ ПОСЛЕДНЯЯ -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>

<div id="taskModal" class="hidden" style="
position:fixed;
top:0; left:0; right:0; bottom:0;
background:rgba(0,0,0,0.7);
display:flex;
align-items:center;
justify-content:center;
z-index:2000;
">

  <div style="
    background:#1e293b;
    padding:20px;
    border-radius:10px;
    width:90%;
    max-width:400px;
  ">

    <h3 id="modalTitle"></h3>

    <textarea id="commentInput" placeholder="Комментарий" style="width:100%"></textarea>

    <button onclick="saveComment()">Сохранить</button>

    <hr>

    <button onclick="updateStatus(currentTaskId, 'done')">✔ Завершить</button>
    <button onclick="setToday(currentTaskId)">Today</button>
    <button onclick="setTomorrow(currentTaskId)">Tomorrow</button>

    <hr>

    <button onclick="deleteTask(currentTaskId)">🗑 Удалить</button>
    <button onclick="closeModal()">Закрыть</button>

  </div>
</div>
  
</body>
</html>
