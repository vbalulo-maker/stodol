<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stodol MVP</title>

<style>
body { font-family: sans-serif; margin:0; background:#0f172a; color:white; }
.container { padding:20px; }
.hidden { display:none; }
input, button { padding:10px; margin:5px 0; }
.btn { background:#6366f1; color:white; border:none; cursor:pointer; }
.card { background:#1e293b; padding:15px; margin-bottom:10px; border-radius:10px; }
nav { display:flex; gap:15px; background:#020617; padding:10px; }
</style>
</head>

<body>

<!-- LANDING -->
<div id="landing" class="container">
<h1>Stodol</h1>
<p>Задачи + дашборд</p>
<button class="btn" onclick="showAuth()">Начать</button>
</div>

<!-- AUTH -->
<div id="auth" class="container hidden">
<h2>Вход</h2>
<input id="email" placeholder="email">
<input id="password" type="password" placeholder="password">
<br>
<button class="btn" onclick="login()">Войти</button>
<button class="btn" onclick="register()">Регистрация</button>
</div>

<!-- APP -->
<div id="app" class="hidden">

<nav>
<div onclick="openTab('dashboard')">Dashboard</div>
<div onclick="openTab('tasks')">Tasks</div>
<div onclick="logout()">Logout</div>
</nav>

<div id="dashboard" class="container tab">
<h2 id="welcome"></h2>
<div class="card">
Задач всего: <span id="tasksCount">0</span>
</div>
</div>

<div id="tasks" class="container tab hidden">
<h2>Tasks</h2>

<input id="taskInput" placeholder="Новая задача">
<button onclick="addTask()">Добавить</button>

<div id="tasksList"></div>
</div>

</div>

<!-- FIREBASE SDK -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {
  getAuth,
  signInWithEmailAndPassword,
  createUserWithEmailAndPassword,
  onAuthStateChanged,
  signOut
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

import {
  getFirestore,
  collection,
  addDoc,
  query,
  where,
  onSnapshot
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";


/* =========================
   ВСТАВЬ СЮДА СВОЙ CONFIG
========================= */
const firebaseConfig = {
  apiKey: "AIzaSyB8baDRTqe9MJatDx1RFIyClanisy9ejsU",
  authDomain: "stodol-ed717.firebaseapp.com",
  projectId: "stodol-ed717"
};
/* ========================= */


const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;


/* AUTH UI */

window.showAuth = () => {
  document.getElementById('landing').classList.add('hidden');
  document.getElementById('auth').classList.remove('hidden');
};


/* REGISTER */
window.register = async () => {
  const email = emailInput.value;
  const password = passwordInput.value;

  await createUserWithEmailAndPassword(auth, email, password);
};


/* LOGIN (реальный, не fake) */
window.login = async () => {
  const email = emailInput.value;
  const password = passwordInput.value;

  await signInWithEmailAndPassword(auth, email, password);
};


/* AUTH STATE */
onAuthStateChanged(auth, (user) => {
  if (user) {
    currentUser = user;

    document.getElementById('auth').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');

    document.getElementById('welcome').innerText =
      "С возвращением, " + user.email;

    startTasksListener();
  }
});


/* LOGOUT */
window.logout = () => {
  signOut(auth);
  location.reload();
};


/* TASKS */

/* СОЗДАНИЕ */
window.addTask = async () => {
  const text = taskInput.value;

  if (!text) return;

  await addDoc(collection(db, "tasks"), {
    text: text,
    userId: currentUser.uid,
    createdAt: Date.now()
  });

  taskInput.value = "";
};


/* REALTIME (onSnapshot) */
function startTasksListener() {

  const q = query(
    collection(db, "tasks"),
    where("userId", "==", currentUser.uid)
  );

  onSnapshot(q, (snapshot) => {

    const tasks = snapshot.docs.map(doc => doc.data());

    renderTasks(tasks);

  });
}


/* RENDER */
function renderTasks(tasks) {

  document.getElementById('tasksCount').innerText = tasks.length;

  const list = document.getElementById('tasksList');
  list.innerHTML = "";

  tasks.forEach(t => {
    const div = document.createElement('div');
    div.className = "card";
    div.innerText = t.text;
    list.appendChild(div);
  });

}


/* NAV */
window.openTab = (id) => {
  document.querySelectorAll('.tab').forEach(t => t.classList.add('hidden'));
  document.getElementById(id).classList.remove('hidden');
};

</script>

    <!-- ✅ Service Worker регистрация — САМАЯ ПОСЛЕДНЯЯ -->
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('/sw.js');
        }
    </script>
  
</body>
</html>
